  <body class="login-page">
    <div class="login-slideshow" aria-hidden="true">
      <div class="login-slide is-active">
        <img src="assets/login/slide-01.webp" alt="" loading="eager" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-02.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-03.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-04.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-05.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-06.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-07.webp" alt="" loading="lazy" />
      </div>
      <div class="login-slide">
        <img src="assets/login/slide-08.webp" alt="" loading="lazy" />
      </div>
    </div>
    <div class="login-bg-overlay" aria-hidden="true"></div>
    <div class="login-shell">
      <div class="login-brand">
        <img
          class="brand-logo"
          src="logo.png?v=20260821logo2"
          alt="Fund Collection logo"
        />
        <p>Fund Collection Management System</p>
      </div>
      <div class="login-card">
        <div class="login-heading mb-4">
          <div class="login-heading-copy">
            <h2>Welcome back</h2>
            <p class="text-muted mb-0">Sign in to continue</p>
          </div>
          <div class="login-theme-controls" aria-label="Appearance controls">
            <button
              type="button"
              class="login-theme-btn"
              id="loginThemeToggle"
              aria-label="Toggle dark mode"
              title="Toggle dark mode"
            >
              <i class="bi bi-moon-stars"></i><span>Dark</span>
            </button>
          </div>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username / ഉപയോക്തൃനാമം</label>
            <input
              id="username"
              class="form-control form-control-lg"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password / പാസ്‌വേഡ്</label>
            <input
              id="password"
              type="password"
              class="form-control form-control-lg"
              required
              placeholder="Enter password"
            />
          </div>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </form>
      </div>
    </div>
    <script src="js/ui-kit.js?v=20260829design2"></script>
    <script src="js/data.js?v=20260821program1"></script>
    <script src="js/device-verification.js?v=20260829design2"></script>
    <script src="js/auth.js?v=20260829design2"></script>
    <script>
      (function () {
        const btn = document.getElementById("loginThemeToggle");
        function sync() {
          const dark = fcmsTheme() === "dark";
          btn.querySelector("i").className =
            "bi " + (dark ? "bi-sun" : "bi-moon-stars");
          btn.querySelector("span").textContent = dark ? "Bright" : "Dark";
          btn.setAttribute(
            "aria-label",
            dark ? "Switch to bright mode" : "Switch to dark mode",
          );
          btn.setAttribute("title", dark ? "Bright mode" : "Dark mode");
        }
        btn?.addEventListener("click", () => {
          toggleFcmsTheme();
          sync();
        });
        sync();
      })();
    </script>
    <script>
      (function () {
        const slideshow = document.querySelector(".login-slideshow");
        if (!slideshow) return;
        if (document.documentElement.classList.contains("fcms-low-power")) {
          slideshow
            .querySelectorAll(".login-slide")
            .forEach((slide, i) =>
              slide.classList.toggle("is-active", i === 0),
            );
          return;
        }
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        const slides = Array.from(slideshow.querySelectorAll(".login-slide"));
        if (slides.length < 2) return;
        let order = slides.map((_, i) => i);
        const shuffle = (arr) => {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };
        try {
          const previous = JSON.parse(
            localStorage.getItem("fcms_login_slide_order") || "null",
          );
          let attempts = 0;
          do {
            order = shuffle(order.slice());
            attempts++;
          } while (
            previous &&
            JSON.stringify(order) === JSON.stringify(previous) &&
            attempts < 8
          );
          localStorage.setItem("fcms_login_slide_order", JSON.stringify(order));
        } catch (_) {
          order = shuffle(order.slice());
        }
        order.forEach((idx, position) => {
          const slide = slides[idx];
          slide.style.order = String(position);
          slide.classList.toggle("is-active", position === 0);
          if (position === 0) {
            const img = slide.querySelector("img");
            if (img) img.loading = "eager";
          }
        });
        if (reduceMotion) return;
        let current = 0;
        window.setInterval(function () {
          const orderedSlides = Array.from(
            slideshow.querySelectorAll(".login-slide"),
          ).sort((a, b) => Number(a.style.order) - Number(b.style.order));
          orderedSlides[current]?.classList.remove("is-active");
          current = (current + 1) % orderedSlides.length;
          orderedSlides[current]?.classList.add("is-active");
        }, 5600);
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) window.location.reload();
        });
      })();
    </script>
  </body>
</html>
