<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCMS Prototype</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css?v=20260818smooth2" />
  </head>
  <body class="login-page">
    <div class="login-theme-wrap">
      <button type="button" class="login-theme-toggle" id="loginThemeToggle" aria-label="Toggle light and dark mode" title="Light / Dark">
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
        <span class="login-theme-label">Dark</span>
      </button>
    </div>
    <div class="login-shell">
      <div class="login-brand">
        <img class="brand-logo" src="logo.png" alt="Fund Collection logo" />
        <p>Fund Collection Management System</p>
      </div>
      <div class="login-card">
        <div class="text-center mb-4">
          <h2>Welcome back</h2>
          <p class="text-muted mb-0">Sign in to continue</p>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username / ഉപയോക്തൃനാമം</label>
            <input
              id="username"
              class="form-control form-control-lg"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password / പാസ്‌വേഡ്</label>
            <input
              id="password"
              type="password"
              class="form-control form-control-lg"
              required
              placeholder="Enter password"
            />
          </div>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </form>
      </div>
    </div>
    <script src="js/ui-kit.js?v=20260818d"></script>
    <script src="js/data.js?v=20260818d"></script>
    <script src="js/auth.js?v=20260820login-theme"></script>
    <script>
      (function () {
        const btn = document.getElementById("loginThemeToggle");
        if (!btn || typeof fcmsTheme !== "function" || typeof setFcmsTheme !== "function") return;
        function syncLoginTheme() {
          const dark = fcmsTheme() === "dark";
          const icon = btn.querySelector("i");
          const label = btn.querySelector(".login-theme-label");
          if (icon) icon.className = "bi " + (dark ? "bi-sun" : "bi-moon-stars");
          if (label) label.textContent = dark ? "Light" : "Dark";
          btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
          btn.setAttribute("title", dark ? "Light mode" : "Dark mode");
        }
        syncLoginTheme();
        btn.addEventListener("click", function () {
          setFcmsTheme(fcmsTheme() === "dark" ? "light" : "dark");
          syncLoginTheme();
        });
      })();
    </script>
  </body>
</html>
