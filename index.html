<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCMS Prototype</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css?v=20260818b" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-brand">
        <img class="brand-logo" src="logo.png" alt="Fund Collection logo" />
        <p>Fund Collection Management System</p>
      </div>
      <div class="login-card">
        <div class="text-center mb-4">
          <h2>Welcome back</h2>
          <p class="text-muted mb-0">Sign in to continue</p>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input
              id="username"
              class="form-control form-control-lg"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              id="password"
              type="password"
              class="form-control form-control-lg"
              required
              placeholder="Enter password"
            />
          </div>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </form>
      </div>
    </div>
    <script src="js/ui-kit.js?v=20260818b"></script>
    <script src="js/data.js?v=20260818b"></script>
    <script src="js/auth.js?v=20260818b"></script>
  </body>
</html>
